services:
  disque:
    # image: richnorth/disque
    build: ./disque/
    ports:
      - "7711:7711"

  disque-other:
    build: ./disque/

  worker-no-ls:
    build: .
    command: ["dwqw", "-D", "disque:7711", "--jobs", "3", "--exclude", "ls.*", "--fallback-disque", "disque-other:7711", "-v"]

    environment:
      - PYTHONUNBUFFERED=1

  worker-else:
    build: .
    command: ["dwqw", "-D", "disque-other:7711", "--jobs", "3", "--prometheus", "-v"]

    environment:
      - PYTHONUNBUFFERED=1

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - worker-else


